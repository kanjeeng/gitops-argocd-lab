apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: argocd-admin-allowlist@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd.gitops.kanjeeng.online
      secretName: argocd-tls
  rules:
    - host: argocd.gitops.kanjeeng.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
