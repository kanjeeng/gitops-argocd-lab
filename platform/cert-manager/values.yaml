# Nilai Helm cert-manager.
crds:
  enabled: true
  keep: true

replicaCount: 1
resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { cpu: 100m, memory: 128Mi }

webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

cainjector:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 100m, memory: 192Mi }
