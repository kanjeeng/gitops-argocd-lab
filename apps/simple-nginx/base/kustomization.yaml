apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# ConfigMap dibuat dari berkas index.html. Kustomize menambahkan hash pada nama,
# sehingga perubahan isi file mengubah nama ConfigMap dan memicu rolling update Pod.
configMapGenerator:
  - name: simple-nginx-index
    files:
      - index.html

labels:
  - pairs:
      app.kubernetes.io/part-of: gitops-lab
    includeSelectors: false
