apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-nginx
  annotations:
    # Ganti menjadi letsencrypt-prod setelah uji staging berhasil (lewat commit Git).
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Membuka pintu masuk untuk port HTTP (web) dan HTTPS (websecure)
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure

    # Sambungkan ke middleware redirect (format: nama-middleware@kubernetescrd)
    traefik.ingress.kubernetes.io/router.middlewares: demo-redirect-to-https@kubernetescrd

    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nginx.gitops.kanjeeng.online
      secretName: simple-nginx-tls
  rules:
    - host: nginx.gitops.kanjeeng.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-nginx
                port:
                  number: 80
