apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-httpd
  annotations:
    # Ganti menjadi letsencrypt-prod setelah uji staging berhasil (lewat commit Git).
    cert-manager.io/cluster-issuer: letsencrypt-staging
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - httpd.gitops.kanjeeng.online
      secretName: simple-httpd-tls
  rules:
    - host: httpd.gitops.kanjeeng.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-httpd
                port:
                  number: 80
