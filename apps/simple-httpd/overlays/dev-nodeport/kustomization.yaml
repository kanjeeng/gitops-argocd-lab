apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../dev

# Mengubah Service menjadi NodePort untuk pembuktian metode akses NodePort.
patches:
  - target:
      kind: Service
      name: simple-httpd
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
