apiVersion: apps/v1
kind: Deployment
metadata:
  name: portofolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portofolio
  template:
    metadata:
      labels:
        app: portofolio
    spec:
      containers:
      - name: portofolio
        image: kanjeeng/portofolio-tailwind-css:latest
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: portofolio-secrets
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10