apiVersion: apps/v1
kind: Deployment
metadata:
  name: portofolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portofolio
  template:
    metadata:
      labels:
        app: portofolio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: portofolio
        image: kanjeeng/portofolio-tailwind-css:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: portofolio-secrets
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
