apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portofolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecurespec:
  ingressClassName: traefik
  rules:
  - host: portofolio-staging.gitops.kanjeeng.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portofolio
            port:
              number: 80
  tls:
  - hosts:
    - portofolio-staging.gitops.kanjeeng.online
    secretName: portofolio-tls
