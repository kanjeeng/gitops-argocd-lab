apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portofolio
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: demo-project
  source:
    repoURL: https://github.com/kanjeeng/gitops-argocd-lab.git
    targetRevision: main
    path: apps/portofolio/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-portofolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true