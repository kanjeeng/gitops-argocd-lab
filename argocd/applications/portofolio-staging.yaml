apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portofolio-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: demo-project
  source:
    repoURL: https://github.com
    targetRevision: main
    path: apps/portofolio/overlays/staging
  destination:
    server: https://default.svc
    namespace: demo-portofolio-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
