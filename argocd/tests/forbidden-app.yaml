# Uji kebijakan AppProject (G-17): Application ini mencoba deploy ke namespace
# di luar demo*. ArgoCD HARUS menolaknya. Terapkan manual, jangan commit ke argocd/applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forbidden-test
  namespace: argocd
spec:
  project: demo-project
  source:
    repoURL: https://github.com/kanjeeng/gitops-argocd-lab.git
    targetRevision: main
    path: apps/simple-nginx/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
